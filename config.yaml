# BlipShell Configuration
# This file is self-modifiable by the agent

models:
  # --- Interactive (cloud via Ollama) ---
  tool_calling: "glm-5:cloud"            # general chat + tool use
  coding: "glm-5:cloud"                   # /code command (benchmark winner: 13/13 checks)
  # --- Background processing (local) ---
  reasoning: "qwen3:14b"                 # entity extraction, tag discovery, lessons, contradiction
  summarization: "glm4:latest"           # memory/session summaries (Groq/Gemini tried first via endpoint priority)
  ranking: "qwen2.5:14b"                 # memory ranking 1-5
  importance: "qwen3:14b"               # memory importance 0.0-1.0
  ranking_importance: "qwen2.5:14b"      # combined rank+importance for batch import
  # --- Embedding (local) ---
  embedding: "nomic-embed-text"          # vector search — snowflake had better quality but too much GPU contention
  # --- Fallbacks (local, used when cloud is down) ---
  tool_calling_fallback: "gpt-oss:latest"
  coding_fallback: "gpt-oss:latest"
  reasoning_fallback: "gpt-oss:latest"
  summarization_fallback: "glm4:latest"
  ranking_fallback: "qwen2.5:14b"
  importance_fallback: "qwen3:14b"
  ranking_importance_fallback: "qwen2.5:7b"   # was 14b; 7b is 40% faster with same accuracy
  fallback_think: false                  # disable thinking for fallback models (faster chat)

endpoints:
  - name: "groq"
    url: "https://api.groq.com/openai/v1"
    provider: "openai"
    api_key: "${GROQ_API_KEY}"
    roles: ["summarization", "ranking_importance"]
    priority: 2                          # ranking primary (30 RPM), summarization fallback when Gemini rate-limits
    max_concurrent: 3
    rate_limit_rpm: 30
    rate_limit_rpd: 1000
    enabled: true
    models:
      summarization: "openai/gpt-oss-120b"
      ranking_importance: "llama-3.3-70b-versatile"
  - name: "gemini"
    url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    provider: "openai"
    api_key: "${GEMINI_API_KEY}"
    roles: ["summarization"]
    priority: 3                          # tried first for summarization (5 RPM, Groq fallback)
    max_concurrent: 2
    rate_limit_rpm: 5
    rate_limit_rpd: 20                   # free tier is 20 RPD (not 1000 — verified 2026-02-27)
    enabled: true
    models:
      summarization: "gemini-2.5-flash"
  - name: "local-cloud"
    url: "http://localhost:11434"
    roles: ["tool_calling", "coding"]
    priority: 1
    max_concurrent: 5
    context_tokens: 196608  # 192K — glm-5:cloud supports 198K
    enabled: true
  - name: "local"
    url: "http://localhost:11434"
    roles: ["reasoning", "embedding", "summarization", "ranking", "importance", "ranking_importance"]
    priority: 1
    max_concurrent: 5
    context_tokens: 32768   # 32K — local models (qwen3:14b, glm4, qwen2.5:14b) don't need more
    enabled: true
  - name: "old-pc"
    url: "http://192.168.0.225:11434"
    roles: ["ranking"]
    priority: 2
    max_concurrent: 2
    context_tokens: 131072
    enabled: false  # not used for import

memory:
  pools:
    core:
      percentage: 0.10
      priority: 5
    active_session:
      percentage: 0.35
      priority: 3
    recent_history:
      percentage: 0.15
      priority: 4
    recall:
      percentage: 0.30
      priority: 2
    buffer:
      percentage: 0.10
      priority: 1

  # total_context_tokens is now derived from the endpoint's context_tokens automatically.
  # Only set this if you need to override the endpoint value for memory pool sizing.
  system_prompt_reserve: 2048
  overflow_batch_size: 4
  recall_search_limit: 20
  min_rank_threshold: 3
  importance_recency_bonus: 0.1
  importance_tag_bonus: 0.05
  similarity_threshold: 0.5
  importance_boost_weight: 0.2
  tag_overlap_boost: 0.1
  search_overfetch_multiplier: 2
  decay_rates:
    fact: 0.0002          # ~50% after 144 days — stable facts persist
    preference: 0.0003    # ~50% after 96 days — preferences evolve slowly
    skill: 0.0001         # ~50% after 289 days — skills are durable
    event: 0.002          # ~50% after 14 days — events become stale fast
    conversation: 0.001   # ~50% after 29 days — default for unclassified

  dedup:
    enabled: true
    similarity_threshold: 0.7  # min cosine similarity to consider as duplicate candidate

  entity_resolution:
    enabled: true                # backfill runs automatically on first startup
    embedding_auto_merge_threshold: 0.85  # auto-merge above this
    llm_arbitration_threshold: 0.70       # ask LLM between this and auto_merge
    max_candidates: 5

  score_floor_ratio: 0.6        # results must be within 60% of the top score
  min_score_floor: 0.4          # absolute minimum boosted_score to keep
  dedup_jaccard_threshold: 0.65 # Jaccard similarity to consider summaries duplicate
  project_session_limit: 50     # max recent project sessions for two-pass search

  auto_prune_days: 90
  prune_max_importance: 0.3
  prune_max_rank: 2

session:
  max_messages_before_summary: 50
  summary_chunk_size: 20
  auto_save_interval: 300  # seconds

agent:
  max_tool_iterations: 50  # CC has no limit; 50 is a generous safety net
  # system_prompt is now defined in config.py defaults (trimmed to 5 rules)
  stream: true

tools:
  shell:
    timeout: 30
    # allowed_commands: empty = allow all commands (CC approach)
    # Safety comes from tool descriptions steering toward dedicated tools
  filesystem:
    max_file_size: 1048576  # 1MB
    blocked_paths:
      - "/etc/shadow"
      - "/etc/passwd"
  web:
    max_fetch_size: 524288  # 512KB
    timeout: 15

noise:
  min_word_count: 3
  max_filler_ratio: 0.6

tagging:
  max_tags: 7

llm:
  max_retries: 2
  retry_base_delay: 1.0
  timeout: 300  # per-call timeout in seconds (5min for slower local models)

auth:
  enabled: false
  api_key: ""

database:
  path: "data/blipshell.db"
  chroma_path: "data/chroma"

web_ui:
  host: "0.0.0.0"
  port: 8000

planner:
  enabled: false           # Auto-detection off — use !plan to trigger manually
  auto_approve: true      # Plans execute immediately (no review step)
  max_steps: 5            # Maximum steps per plan
  max_retries_per_step: 2 # Retries before marking step as failed
  complexity_threshold_words: 20  # Word count threshold for planning

worker:
  enabled: false                     # Enable remote worker routing
  default_remote_endpoint: ""        # Name of default remote endpoint
  task_types_for_remote:             # Task types auto-routed to remote
    - "summarization"
    - "research"
    - "analysis"
  poll_interval: 10                  # Seconds between worker polls

# Per-model behavioral settings (Aider-inspired)
# Configures how the agent interacts with each model.
# Model name matching is flexible: exact, base name, or prefix.
model_settings:
  qwen3-coder:
    max_tool_calls: 20
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones. Keep changes minimal."
  devstral:
    max_tool_calls: 25
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones."
  gpt-oss:
    max_tool_calls: 10
    use_repo_map: true
    think: false
    extra_instructions: "Be direct. Skip exploration and go straight to implementation."
  glm-5:
    max_tool_calls: 15
    use_repo_map: true
  glm4:
    max_tool_calls: 5
    use_repo_map: false
