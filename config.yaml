# BlipShell configuration.
#
# This file holds the MODEL/ENDPOINT ROUTING plus only the values that DIFFER
# from the code defaults. Every other knob, with its documentation, lives in
# blipshell/models/config.py — an unset key here means "the default", on
# purpose. Pruned from 420 lines on 2026-09-02; the old fully-expanded file is
# in git history.
#
# WHY each model/endpoint choice: docs/MODEL_DECISIONS.md (dated decision log).
# Keep durable rationale THERE, not here — programmatic saves (web
# /api/config, personality import) rewrite this file and drop comments.

models:
  # --- Interactive ---
  tool_calling: "gemma4:31b-cloud"   # main model, decided 2026-09-02 (agent eval) — see MODEL_DECISIONS.md
  coding: "minimax/minimax-m3"       # OpenRouter (paid), unaffected by Ollama free-tier churn
  # --- Background processing (local) ---
  reasoning: "qwen3:14b"
  summarization: "glm4:latest"       # Groq tried first via endpoint priority
  ranking: "qwen3:14b"
  importance: "qwen3:14b"
  ranking_importance: "qwen3:14b"
  session_review: "qwen3:14b"        # local name; local-cloud endpoint overrides — see endpoints
  reflection: "qwen3:14b"            # local name; local-cloud endpoint overrides — see endpoints
  embedding: "qwen3-embedding:0.6b"  # local, always
  # --- Fallbacks (local, used when cloud is down) ---
  tool_calling_fallback: "gpt-oss:latest"
  coding_fallback: "gpt-oss:latest"
  reasoning_fallback: "gpt-oss:latest"
  summarization_fallback: "qwen3:14b"
  ranking_fallback: "qwen3:14b"
  importance_fallback: "qwen3:14b"
  ranking_importance_fallback: "qwen3.5:9b"
  session_review_fallback: "qwen3:14b"   # idle/nightly fallbacks stay on resident models (2026-07-31 cold-load incident)
  reflection_fallback: "qwen3:14b"
  fallback_think: false

endpoints:
  - name: "openrouter"
    url: "https://openrouter.ai/api/v1"
    provider: "openai"
    api_key: "${OPENROUTER_API_KEY}"
    roles: ["coding", "tool_calling"]
    priority: 1                # chat fallback when Ollama cloud is down; coding primary
    max_concurrent: 5
    context_tokens: 204800
    pii_sanitize: true         # data leaves the machine (chat = credentials only; background = full — see llm/pii.py)
    enabled: true
    models:
      coding: "minimax/minimax-m3"
      tool_calling: "minimax/minimax-m3"
  - name: "groq"
    url: "https://api.groq.com/openai/v1"
    provider: "openai"
    api_key: "${GROQ_API_KEY}"
    roles: ["summarization", "ranking_importance"]
    priority: 2
    max_concurrent: 3
    rate_limit_rpm: 30
    rate_limit_rpd: 1000
    rate_limit_tpm: 6000       # free tier — large requests skip to local
    enabled: true
    models:
      summarization: "openai/gpt-oss-120b"
      ranking_importance: "openai/gpt-oss-120b"
  - name: "local-cloud"        # Ollama daemon relaying to Ollama's cloud (free tier)
    url: "http://localhost:11434"
    roles: ["tool_calling", "session_review", "reflection"]
    priority: 2                # tried before "local" for these roles
    max_concurrent: 5
    context_tokens: 131072
    pii_sanitize: true         # relays offsite despite the localhost URL; /local mode hides it
    enabled: true
    models:                    # all three decided 2026-09-02/03 — see MODEL_DECISIONS.md
      tool_calling: "gemma4:31b-cloud"
      session_review: "gemma4:31b-cloud"   # measured 2026-09-03: beats local on both jobs; best available since minimax delisted
      reflection: "gemma4:31b-cloud"
  - name: "local"
    url: "http://localhost:11434"
    roles: ["reasoning", "embedding", "summarization", "ranking", "importance", "ranking_importance", "session_review", "reflection"]
    priority: 1
    max_concurrent: 5
    context_tokens: 32768
    enabled: true

tools:
  web:
    tavily_api_key: "${TAVILY_API_KEY}"

llm:
  timeout: 300        # slower local models need more than the 120s default

database:
  path: "data/blipshell.db"
  # This instance HAS a corpus: a missing file at the resolved path is always
  # a wrong-path launch — refuse, don't let SQLite create a phantom database
  # (nine days of history went into one, 2026-08-11..08-20). Fresh installs
  # set this false.
  require_existing: true

telegram:
  bot_token: "${BLIPSHELL_TELEGRAM_TOKEN}"   # integration stays disabled (default)

planner:
  enabled: false      # auto-detection off — use !plan to trigger manually
  max_steps: 5

benchmark:
  judge_model: "anthropic/claude-opus-4.8"   # neutral frontier grader, never a candidate
  judge_endpoint: "openrouter"

reflection:
  gravity_enabled: true    # step-1 opt-in taken (default false)

# Per-model behavioral settings (Aider-inspired). Name matching is flexible:
# exact, base name, or prefix — the base-name match splits on ':' OR '/', so
# "minimax-m3:cloud" matches "minimax-m3" but "minimax/minimax-m3" only "minimax".
model_settings:
  minimax-m3:
    vision_capable: true
  minimax/minimax-m3:
    vision_capable: true
  qwen3-coder:
    max_tool_calls: 20
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones. Keep changes minimal."
  devstral:
    max_tool_calls: 25
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones."
  gpt-oss:
    max_tool_calls: 10
    use_repo_map: true
    think: false
    extra_instructions: "Be direct. Skip exploration and go straight to implementation."
  minimax-m2.7:
    max_tool_calls: 20
    use_repo_map: true
  glm4:
    max_tool_calls: 5
    use_repo_map: false
