# BlipShell Configuration
# This file is self-modifiable by the agent

models:
  # --- Interactive ---
  tool_calling: "minimax-m3:cloud"  # general chat — 100% tool pass (2026-06-01 bench, ties m2.5, beats m2.7 which skipped web searches)
  coding: "minimax/minimax-m3"          # project mode coding via OpenRouter (matched m2.5 quality on bench, newer + larger context)
  # --- Background processing (local) ---
  reasoning: "qwen3:14b"                 # entity extraction, tag discovery, lessons, contradiction
  summarization: "glm4:latest"           # memory/session summaries (Groq/Gemini tried first via endpoint priority)
  ranking: "qwen3:14b"                   # memory ranking 1-5 (was qwen2.5:14b — qwen3:14b matches reasoning, avoids model swap)
  importance: "qwen3:14b"               # memory importance 0.0-1.0
  ranking_importance: "qwen3:14b"        # combined rank+importance (was qwen2.5:14b — consolidate on reasoning model)
  # --- Session Review (local primary, cloud for big sessions) ---
  session_review: "qwen3:14b"             # whole-session analysis (lessons, reflections)
  # --- Embedding (local) ---
  embedding: "qwen3-embedding:0.6b"      # vector search — 10% better similarity than nomic, understands domain terms
  # --- Fallbacks (local, used when cloud is down) ---
  tool_calling_fallback: "gpt-oss:latest"
  coding_fallback: "gpt-oss:latest"
  reasoning_fallback: "gpt-oss:latest"
  summarization_fallback: "qwen3:14b"    # was glm4; qwen3:14b scores 100/95% vs 92/100%, already loaded
  ranking_fallback: "qwen3:14b"
  importance_fallback: "qwen3:14b"
  ranking_importance_fallback: "qwen3.5:9b"   # was qwen2.5:7b; qwen3.5:9b scores 98/98% vs 92/90%
  session_review_fallback: "qwen3:14b"        # was gpt-oss:latest — that forced a large COLD load at 2am and llama-server died on CUDA init (2026-07-31); qwen3:14b is the session_review primary and already resident
  fallback_think: false                  # disable thinking for fallback models (faster chat)

endpoints:
  - name: "openrouter"
    url: "https://openrouter.ai/api/v1"
    provider: "openai"
    api_key: "${OPENROUTER_API_KEY}"
    roles: ["coding", "tool_calling"]
    priority: 1                          # fallback for chat when Ollama cloud is down; primary for coding
    max_concurrent: 5
    context_tokens: 204800               # MiniMax M3's OpenRouter provider serves 512K; capped at 204.8K to match the Ollama-cloud chat endpoint and bound request cost
    pii_sanitize: true                   # data leaves machine via OpenRouter.
                                         # Interactive chat = credentials only;
                                         # background calls = full. See `pii:` below.
    enabled: true
    models:
      coding: "minimax/minimax-m3"
      tool_calling: "minimax/minimax-m3"
  - name: "groq"
    url: "https://api.groq.com/openai/v1"
    provider: "openai"
    api_key: "${GROQ_API_KEY}"
    roles: ["summarization", "ranking_importance"]
    priority: 2                          # ranking primary (30 RPM), summarization fallback when Gemini rate-limits
    max_concurrent: 3
    rate_limit_rpm: 30
    rate_limit_rpd: 1000
    rate_limit_tpm: 6000                 # free tier TPM limit — large requests skip to local
    enabled: true
    models:
      summarization: "openai/gpt-oss-120b"
      ranking_importance: "llama-3.3-70b-versatile"
  - name: "gemini"
    url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    provider: "openai"
    api_key: "${GEMINI_API_KEY}"
    roles: ["summarization"]
    priority: 3                          # tried first for summarization (5 RPM, Groq fallback)
    max_concurrent: 2
    rate_limit_rpm: 10                    # free tier: 10 RPM (Google docs say 10, was 5)
    rate_limit_rpd: 250                  # free tier: 250 RPD (error showed 20 — may be per-interval burst limit)
    enabled: false                       # disabled: 20-request burst limit makes free tier unreliable
    models:
      summarization: "gemini-2.5-flash"
  - name: "local-cloud"
    url: "http://localhost:11434"
    roles: ["tool_calling", "session_review"]             # primary for chat; coding goes to OpenRouter
    priority: 2                                           # tried first for both roles (higher = first)
    max_concurrent: 5
    context_tokens: 131072  # 128K — gpt-oss:120b-cloud context window
    pii_sanitize: true       # cloud models relay to remote server — data leaves machine.
                             # Interactive chat = credentials only; background
                             # calls (session_review) = full. See `pii:` below.
    enabled: true
    models:
      tool_calling: "minimax-m3:cloud"  # Ollama cloud free tier
      # session_review -> minimax-m3:cloud, chosen on measured evidence 2026-08-04.
      # It beats local qwen3:14b on BOTH jobs this key controls: session review
      # 0.944 vs 0.844, and lesson extraction 0.585 vs 0.345. Lessons was the
      # deciding number — qwen3 scored 0.420 then 0.345 on a re-run, so it's a
      # real weakness, and lessons feed a permanent context pool plus the
      # anti-pattern store. (History: this slot held kimi-k2.5:cloud until Ollama
      # retired it mid-nightly on 2026-07-31; kimi-k2.7-code was rejected at
      # 0.395 lessons, the worst of every model measured.)
      #
      # Two known costs of routing here rather than local:
      #  1. pii_sanitize scrubs names/dates from the full transcript before the
      #     model sees it. The benchmark feeds UNSANITIZED synthetic sessions, so
      #     0.585 is an UPPER BOUND on real lesson quality. Watch actual lessons.
      #  2. Same free tier that retired kimi with no notice. Now bounded: a 410
      #     is classified as a model error, so it falls back to local qwen3:14b
      #     without penalising this endpoint (which also serves interactive chat).
      session_review: "minimax-m3:cloud"
  - name: "local"
    url: "http://localhost:11434"
    roles: ["reasoning", "embedding", "summarization", "ranking", "importance", "ranking_importance", "session_review"]
    priority: 1
    max_concurrent: 5
    context_tokens: 32768   # 32K — local models (qwen3:14b, glm4, qwen2.5:14b) don't need more
    enabled: true
  - name: "old-pc"
    url: "http://192.168.0.225:11434"
    roles: ["ranking"]
    priority: 2
    max_concurrent: 2
    context_tokens: 131072
    enabled: false  # not used for import

memory:
  pools:
    core:           # Stable personal facts (core_memories). Always present.
      percentage: 0.05
      priority: 5
    lessons:        # Top extracted insights. Always present.
      percentage: 0.05
      priority: 4
    active_session: # Current conversation messages.
      percentage: 0.30
      priority: 3
    recent_history: # Previous session memories + summaries.
      percentage: 0.20
      priority: 2
    recall:         # Search results — most relevant content per query. Largest pool.
      percentage: 0.40
      priority: 1

  # total_context_tokens is now derived from the endpoint's context_tokens automatically.
  # Only set this if you need to override the endpoint value for memory pool sizing.
  system_prompt_reserve: 2048
  overflow_batch_size: 4
  recall_search_limit: 20
  min_importance: 0.25
  importance_recency_bonus: 0.1
  importance_tag_bonus: 0.05
  similarity_threshold: 0.35
  importance_boost_weight: 0.2
  tag_overlap_boost: 0.1
  search_overfetch_multiplier: 2
  decay_rates:
    fact: 0.0002          # ~50% after 144 days — stable facts persist
    preference: 0.0003    # ~50% after 96 days — preferences evolve slowly
    skill: 0.0001         # ~50% after 289 days — skills are durable
    event: 0.002          # ~50% after 14 days — events become stale fast
    conversation: 0.001   # ~50% after 29 days — default for unclassified

  dedup:
    enabled: true
    similarity_threshold: 0.7  # min cosine similarity to consider as duplicate candidate

  entity_resolution:
    enabled: true                # backfill runs automatically on first startup
    embedding_auto_merge_threshold: 0.85  # auto-merge above this
    llm_arbitration_threshold: 0.70       # ask LLM between this and auto_merge
    max_candidates: 5

  score_floor_ratio: 0.6        # results must be within 60% of the top score
  min_score_floor: 0.4          # absolute minimum boosted_score to keep
  dedup_jaccard_threshold: 0.65 # Jaccard similarity to consider summaries duplicate
  project_session_limit: 50     # max recent project sessions for two-pass search

  auto_prune_days: 90
  prune_max_importance: 0.3
  prune_max_rank: 2

  # Entity graph pruning — soft-archive low-value entities (nightly "prune_entities" job).
  # Reversible: flips is_archived, never deletes. Dry-run logs candidates without touching data.
  entity_prune_enabled: false      # opt-in
  entity_prune_dry_run: true       # log-only until you explicitly set this false
  entity_prune_min_age_days: 30    # never prune entities younger than this
  entity_prune_max_mentions: 1     # prune only if mention count <= this
  entity_prune_max_degree: 1       # prune only if relationship degree <= this

  # Retroactive entity merge — consolidate duplicate entities already in the graph
  # (nightly "merge_entities" job). Conservative: a bad merge destroys edge
  # differentiation. Thresholds are higher than creation-time resolution.
  entity_merge_enabled: false      # opt-in
  entity_merge_dry_run: true       # log-only until you explicitly set this false
  entity_merge_auto_threshold: 0.90  # auto-merge above this similarity
  entity_merge_llm_threshold: 0.80   # LLM arbitration (edge-aware) band: this..auto
  entity_merge_max_candidates: 5     # similar entities checked per entity
  entity_merge_edge_sample: 5        # edges shown to the arbitration LLM

session:
  max_messages_before_summary: 50
  summary_chunk_size: 20
  auto_save_interval: 300  # seconds

agent:
  max_tool_iterations: 50  # CC has no limit; 50 is a generous safety net
  # system_prompt is now defined in config.py defaults (trimmed to 5 rules)
  stream: true

tools:
  shell:
    timeout: 30
    # allowed_commands: empty = allow all commands (CC approach)
    # Safety comes from tool descriptions steering toward dedicated tools
  filesystem:
    max_file_size: 1048576  # 1MB
    blocked_paths:
      - "/etc/shadow"
      - "/etc/passwd"
  web:
    max_fetch_size: 524288  # 512KB
    timeout: 15
    tavily_api_key: "${TAVILY_API_KEY}"  # Sign up at tavily.com (1000 free searches/month)

# PII handling on cloud paths. Two DIFFERENT strengths, by path, because the
# two categories have opposite cost profiles (see llm/pii.py):
#
#  - Background/bulk calls via router.generate() (summarization, session
#    review, lessons, ranking) get FULL sanitization: credentials AND identity
#    (names -> [PERSON_1], dates -> [DATE], locations, URLs). The text is
#    processed once and only the output is stored, so the comprehension cost is
#    bounded. NOTE: this is why benchmark lesson scores are an upper bound —
#    the benchmark feeds unsanitized text.
#
#  - Interactive chat gets CREDENTIALS ONLY (api keys, tokens, JWTs, private
#    keys). Redacting those costs the model nothing; redacting identity would
#    cost a great deal and protect little — spaCy NER tags product names as
#    entities (Groq, Ollama, Presidio, Devstral become [PERSON]/[LOCATION]),
#    while a username still leaks through every file path. Full NER over the
#    whole assembled context on every turn is also too slow for this path.
#
# For genuinely private conversations the answer is ROUTING, not redaction:
# keep the conversation on a local model. See docs/V2_PLAN.md (D1) — that
# switch is not built yet.
pii:
  enabled: true        # master switch for both strengths above
  cloud_only: true     # DEAD — never read. Behavior is hard-coded in
                       # Endpoint.should_sanitize_pii (endpoints.py), which is
                       # already cloud-only. Slated for deletion in Phase 2.

noise:
  min_word_count: 3
  max_filler_ratio: 0.6

tagging:
  max_tags: 7

llm:
  max_retries: 2
  retry_base_delay: 1.0
  timeout: 300  # per-call timeout in seconds (5min for slower local models)

auth:
  enabled: false
  api_key: ""

database:
  path: "data/blipshell.db"
  embedding_dimensions: 1024  # qwen3-embedding:0.6b output size

telegram:
  bot_token: "${BLIPSHELL_TELEGRAM_TOKEN}"  # from @BotFather
  allowed_user_ids: []                       # your Telegram user ID (send /start, check logs)
  enabled: false

web_ui:
  host: "0.0.0.0"
  port: 8000

planner:
  enabled: false           # Auto-detection off — use !plan to trigger manually
  auto_approve: true      # Plans execute immediately (no review step)
  max_steps: 5            # Maximum steps per plan
  max_retries_per_step: 2 # Retries before marking step as failed
  complexity_threshold_words: 20  # Word count threshold for planning

worker:
  enabled: false                     # Enable remote worker routing
  default_remote_endpoint: ""        # Name of default remote endpoint
  task_types_for_remote:             # Task types auto-routed to remote
    - "summarization"
    - "research"
    - "analysis"
  poll_interval: 10                  # Seconds between worker polls

# Unified model-benchmark harness — `blipshell benchmark run/scoreboard/discover`.
# `blipshell benchmark run <model>` runs ONE deep test across every job (ability
# + speed), grades open-ended jobs with a neutral judge, and writes a shareable
# report to data/benchmark/report.md. No tiers, no switch-verdict — the report is
# numbers only, for you (or a stronger LLM) to weigh given BlipShell's local/cloud
# routing. `benchmark report` regenerates the file from stored runs.
benchmark:
  db_path: "data/benchmark.db"       # dedicated store (NOT blipshell.db)
  # Judge: a strong model that is NOT a candidate, to avoid self-grading bias.
  # judge_endpoint must name an endpoint in `endpoints:` above. Leave judge_model
  # empty to disable judging (then open-ended jobs are simply not scored).
  # Verify the exact OpenRouter slug you have credits for before a real run.
  judge_model: "anthropic/claude-opus-4.8"   # frontier neutral grader
  judge_endpoint: "openrouter"
  judge_timeout: 60.0
  task_weights: {}                   # composite weighting; empty = equal, e.g. {coding: 2.0, ranking: 0.5}
  full_sample: 50                    # real-DB sample size for the real-data drift checks
  discover_min_context: 0            # shortlist floor (0 = none)
  discover_max_price: 0.0            # shortlist ceiling $/1M prompt tokens (0 = none)

# Modular cube robotics — software-first. When enabled, BlipShell listens for
# cube connections; cubes auto-register, their actions become tools, and the
# LLM authors behaviors. Launch a cube: python -m scripts.cube_window
robotics:
  enabled: false                     # set true to open the cube server
  host: "127.0.0.1"
  port: 8765
  invoke_timeout: 10.0               # seconds to await a remote cube's result
  idle_seconds: 30.0                 # quiet time before a truthful system_idle event fires

# Idle self-reflection — after a long quiet gap BlipShell forms one self-originated
# "lingering thought" (from its own prior thoughts, not the conversation) and may
# raise it unprompted when you return. Experimental; fires once per gap.
reflection:
  enabled: true
  idle_seconds: 10800.0              # ~3 hours quiet before it reflects
  max_keep: 50                       # past thoughts retained
  # Standing injection — a relevant past thought resurfaces as context, not just
  # the one-shot return greeting. Two-stage: loose cosine prefilter, then a local
  # LLM relevance judge (yes/no) decides. Does NOT use the reranker; gated by
  # inject_enabled only. Fail-closed (judge error → nothing injects), max=1 backstop.
  inject_enabled: true
  inject_cosine_floor: 0.4           # loose recall prefilter — NOT the gate
  inject_rerank_floor: 0.8           # the real gate: judge verdict (1.0/0.0) must clear this
  inject_max: 1                      # thoughts injected per turn
  inject_prefilter_k: 3              # candidates sent to the judge
  # Self-gravity (step 1): each lingering thought carries a weight — recurrence
  # reinforces it, surfacing fatigue + age decay erode it. Heaviest-relevant
  # thought surfaces; heavy ones render "[Thought · recurring]". Self-layer only;
  # never touches retrieval ranking. The relevance gate is unchanged and still
  # required, so gravity only re-orders/marks what was already going to surface.
  gravity_enabled: true              # the switch — turn the feature on
  gravity_recur_threshold: 0.85      # cosine above which a new thought "echoes" a prior
  gravity_recur_boost: 0.5           # weight added to an echoed prior
  gravity_fatigue: 0.6               # weight x this each time a thought surfaces (anti-spiral)
  gravity_half_life_days: 30.0       # effective weight halves over this span
  gravity_min_weight: 0.1            # floor so decay/fatigue never zero a thought
  gravity_marker_weight: 1.5         # render "recurring" marker at/above this weight

# Per-model behavioral settings (Aider-inspired)
# Configures how the agent interacts with each model.
# Model name matching is flexible: exact, base name, or prefix.
model_settings:
  # Vision-capable models (accept image input). Both name forms are declared
  # because the registry base-name match splits on ':' OR '/': "minimax-m3:cloud"
  # matches "minimax-m3", but "minimax/minimax-m3" matches only "minimax".
  minimax-m3:
    vision_capable: true
  minimax/minimax-m3:
    vision_capable: true
  # kimi-k2.5 removed 2026-07-31 — Ollama retired the model. Nothing routes
  # to it, so a vision_capable claim for it is self-description that can only
  # drift out of sync with what's actually callable.
  qwen3-coder:
    max_tool_calls: 20
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones. Keep changes minimal."
  devstral:
    max_tool_calls: 25
    use_repo_map: true
    extra_instructions: "Prefer editing existing files over creating new ones."
  gpt-oss:
    max_tool_calls: 10
    use_repo_map: true
    think: false
    extra_instructions: "Be direct. Skip exploration and go straight to implementation."
  minimax-m2.7:
    max_tool_calls: 20
    use_repo_map: true
  glm4:
    max_tool_calls: 5
    use_repo_map: false
