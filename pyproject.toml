[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blipshell"
version = "0.2.0"
description = "Local LLM personal assistant with persistent memory"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "openai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=7.0.0",
    "tavily-python>=0.5.0",
    "prompt_toolkit>=3.0.40",
    "python-telegram-bot>=22.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    # Powers the undefined-name check in tests/test_build_messages.py, which
    # skips itself when absent. A NameError on a code path no test calls is
    # invisible to the suite — that is how a total chat outage shipped green.
    "pyflakes>=3.2",
]
# Optional: DeepEval for the judging-methodology spike (G-Eval). The spike script
# guards its import, so this is only needed to include the G-Eval column.
benchmark = [
    "deepeval>=2.0",
]

[project.scripts]
blipshell = "blipshell.ui.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
